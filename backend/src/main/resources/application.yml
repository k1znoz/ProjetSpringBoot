spring:
  application:
    name: gestion-scolaire-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:gestion_scolaire_db}
    username: ${POSTGRES_USER:gestion_scolaire_user}
    password: ${POSTGRES_PASSWORD:gestion_scolaire_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

application:
  security:
    jwt:
      secret: ${APPLICATION_SECURITY_JWT_SECRET:12345678901234567890123456789012}
      expiration: ${APPLICATION_SECURITY_JWT_EXPIRATION:3600000}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
