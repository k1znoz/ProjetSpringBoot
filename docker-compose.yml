services:
  postgres:
    image: postgres:16-alpine
    container_name: gestion_scolaire_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${POSTGRES_TZ:-Europe/Paris}
      PGTZ: ${POSTGRES_PGTZ:-Europe/Paris}
    volumes:
      - gestion_scolaire_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gestion_scolaire_net

volumes:
  gestion_scolaire_postgres_data:
    name: gestion_scolaire_postgres_data

networks:
  gestion_scolaire_net:
    name: gestion_scolaire_net
    driver: bridge
